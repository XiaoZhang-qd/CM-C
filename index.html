<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:24px;
}
/* 1: 复刻GitHub pre样式 */
pre {
  font-family: ui-monospace, "Liberation Mono", "DejaVu Sans Mono", monospace;
  white-space: pre !important;
  tab-size:4;
  line-height:1.2;
  letter-spacing:0;
}
/* 为Linux的firefox消除a标签带来的空白偏移 */
pre a {
  display:inline !important;
  margin:0 !important;
  padding:0 !important;
  line-height:inherit !important;
  vertical-align:baseline !important;
  text-decoration:none;
}
/* GitHub图标样式 */
.link-item a{
  display:inline-block;
  transition:transform 0.2s ease;
  text-decoration: none;
}
.link-item a:hover{
  transform:scale(1.1);
}
.github-svg{
  width:32px;
  height:32px;
  fill:#24292f;
  shape-rendering: geometricPrecision;
}
.github-svg:hover{
  fill:#0969da;
}
</style>
</head>
